<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#1f4e5f" />
    <meta name="description" content="Samordnad livsmedelsförsörjning för hushållet. Veckomatsedel och inköpslista mot City Gross." />
    <title>Departementet för middagsfrågor</title>
    <script>
      /*
       * GitHub Pages har ingen server som kan svara på djuplänkar. 404.html
       * kodar in sökvägen i query-strängen och skickar hit; här packas den upp
       * igen innan React Router startar, så adressfältet ser normalt ut.
       */
      ;(function () {
        var sokning = window.location.search
        if (sokning.indexOf('?/') !== 0) return
        var vag = sokning
          .slice(2)
          .split('&')
          .map(function (del) {
            return del.replace(/~and~/g, '&')
          })
        window.history.replaceState(
          null,
          '',
          window.location.pathname.replace(/\/$/, '') + '/' + vag[0] + (vag[1] ? '?' + vag[1] : '') + window.location.hash,
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Departementet för middagsfrågor kräver JavaScript för att visa matsedel och inköpslista.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
