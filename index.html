<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      Content Security Policy.

      Sätts som meta-tagg eftersom GitHub Pages inte kan sätta svarsheader.
      Det har en känd lucka: frame-ancestors fungerar inte via meta, så
      klickjackningsskyddet saknas. Se docs/SECURITY.md.

      script-src klarar sig utan 'unsafe-inline' tack vare att
      omdirigeringsskriptet ligger i egen fil. style-src behöver det däremot,
      eftersom React sätter style-attribut direkt på element.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https://www.citygross.se;
        font-src 'self';
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        manifest-src 'self';
        worker-src 'self';
        upgrade-insecure-requests;
      "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#1f4e5f" />
    <meta
      name="description"
      content="Samordnad livsmedelsförsörjning för hushållet. Veckomatsedel och inköpslista mot City Gross."
    />
    <title>Departementet för middagsfrågor</title>

    <script src="./spa-redirect.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Departementet för middagsfrågor kräver JavaScript för att visa matsedel och inköpslista.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
