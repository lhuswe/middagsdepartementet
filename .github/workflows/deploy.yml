name: Bygg och publicera

on:
  push:
    branches: [main]
  # Gör det möjligt att publicera om utan att pusha något.
  workflow_dispatch:

# Bara en publicering åt gången. Köade körningar avbryts inte mitt i - en halv
# deploy är värre än en sen.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  kontroll:
    name: Typer, lint och tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typkontroll
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Live-testerna mot City Gross körs medvetet inte här. De beror på någon
      # annans produktionsmiljö och skulle göra bygget instabilt av skäl som
      # inte har med koden att göra. Kör dem manuellt med `npm run test:live`.
      - name: Tester
        run: npm test

  bygg:
    name: Bygg
    needs: kontroll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # En tom secret ger ett bygge som startar och sedan visar en felsida.
      # Bättre att stoppa här än att publicera något som inte fungerar.
      - name: Kontrollera att konfigurationen finns
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          saknas=""
          [ -z "$VITE_SUPABASE_URL" ] && saknas="$saknas VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && saknas="$saknas VITE_SUPABASE_ANON_KEY"
          if [ -n "$saknas" ]; then
            echo "::error::Saknade repository secrets:$saknas - se docs/DEPLOYMENT.md"
            exit 1
          fi
          echo "Konfigurationen finns."

      - name: Bygg
        run: npm run build
        env:
          # Publika värden. Skyddet ligger i RLS, inte i att nyckeln är hemlig -
          # men de sätts som repository secrets ändå, så att en fork inte pekar
          # på den här databasen.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Kontrollera att inga hemligheter följde med bygget
        run: |
          # En service role-nyckel får aldrig hamna i en statisk build.
          #
          # Kontrollen letar efter nyckel*värden*, inte efter ord. En tidigare
          # version sökte på strängen "sb_secret_" och slog ut bygget på
          # supabase-js egen prefixkonstant - en larmfunktion som ropar på sig
          # själv är värre än ingen alls.
          fel=0

          # Riktiga hemliga nycklar: prefix följt av faktiskt nyckelinnehåll.
          if grep -rqE 'sb_secret_[A-Za-z0-9_-]{16,}' dist/; then
            echo "::error::Bygget innehåller en hemlig Supabase-nyckel."
            fel=1
          fi

          # JWT:er vars payload säger service_role. Avkodas för att slippa
          # gissa utifrån hur de ser ut.
          for jwt in $(grep -rhoE 'eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}' dist/ | sort -u); do
            payload=$(printf '%s' "$jwt" | cut -d. -f2)
            avkodad=$(printf '%s==' "$payload" | base64 -d 2>/dev/null || true)
            case "$avkodad" in
              *service_role*)
                echo "::error::Bygget innehåller en JWT med rollen service_role."
                fel=1
                ;;
            esac
          done

          if [ "$fel" -ne 0 ]; then exit 1; fi
          echo "Inga hemligheter hittades i dist/."

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicera:
    name: Publicera till GitHub Pages
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
